<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produits — BEL-AIR</title>
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="brand"><img src="images/logo.png" alt="BEL-AIR"> BEL-AIR</a>
    <ul class="nav-menu">
      <li><a href="index.html">Accueil</a></li>
      <li><a href="products.html" class="is-active">Produits</a></li>
      <li><a href="cart.html">Panier <span class="cart-badge" data-cart-count>0</span></a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>
</header>

<section class="container" style="padding-top:44px;">
  <div class="section-head">
    <div>
      <span class="eyebrow">Catalogue</span>
      <h2>Tous nos produits</h2>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" class="input" id="search-input" placeholder="Rechercher un produit...">
    <select class="input" id="category-filter">
      <option value="">Toutes les catégories</option>
    </select>
  </div>

  <div class="product-grid" id="product-grid"></div>
  <p class="muted" id="empty-message" style="display:none;text-align:center;padding:40px 0;">Aucun produit ne correspond à votre recherche.</p>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© <span data-year></span> BEL-AIR. Tous droits réservés.</span>
      <a href="admin.html">Espace administrateur</a>
    </div>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/products.js"></script>
</body>
</html>
